<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILANO - Bán mang đi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 14px; font-weight: 700; color: #f97316; }
        .header .staff { font-size: 11px; color: #94a3b8; }
        .header .time { font-size: 12px; color: #94a3b8; font-weight: 600; }

        /* ===== DANH MỤC NGANG ===== */
        .cat-bar {
            display: flex;
            overflow-x: auto;
            padding: 6px 8px;
            gap: 6px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .cat-btn.active {
            background: #f97316;
            color: #fff;
            border-color: #f97316;
        }
        .cat-btn:active { transform: scale(0.95); }

        /* ===== Ô TÌM KIẾM ===== */
        .search-bar {
            padding: 6px 8px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: #f1f5f9;
            font-size: 13px;
            outline: none;
        }
        .search-bar input::placeholder { color: #64748b; }

        /* ===== LƯỚI MENU ===== */
        .menu-area {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            align-content: start;
            padding-bottom: 120px; /* chừa chỗ cho giỏ hàng fixed */
        }
        .menu-area::-webkit-scrollbar { width: 3px; }
        .menu-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .m-item {
            background: #1e293b;
            border-radius: 10px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #334155;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 68px;
        }
        .m-item:active {
            transform: scale(0.93);
            background: #f97316;
            border-color: #f97316;
        }
        .m-item .name { font-size: 12px; font-weight: 600; color: #f1f5f9; margin-bottom: 2px; line-height: 1.3; }
        .m-item .price { font-size: 11px; color: #f97316; font-weight: 700; }
        .m-item:active .name,
        .m-item:active .price { color: #fff; }

        /* ===== GIỎ HÀNG FIXED DƯỚI ĐÁY ===== */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 8px 10px;
            z-index: 20;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .cart-bar .cart-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .cart-bar .cart-info .cart-count {
            font-size: 12px;
            color: #94a3b8;
        }
        .cart-bar .cart-info .cart-total {
            font-size: 18px;
            font-weight: 800;
            color: #f97316;
        }
        .cart-bar .pay-row {
            display: flex;
            gap: 4px;
            pointer-events: auto;
        }
        .cart-bar .pay-row .pay-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            color: #fff;
        }
        .cart-bar .pay-row .pay-btn:active { transform: scale(0.95); opacity: 0.9; }
        .pay-btn.cash { background: #16a34a; }
        .pay-btn.transfer { background: #2563eb; }
        .pay-btn.grab { background: #9333ea; }
        .pay-btn:disabled { opacity: 0.3; pointer-events: none; }

        /* ===== GIỎ HÀNG POPUP ===== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 30;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .cart-overlay.show { display: flex; }
        .cart-popup {
            width: 100%;
            max-width: 420px;
            max-height: 60vh;
            background: #1e293b;
            border-radius: 16px 16px 0 0;
            padding: 12px 10px;
            padding-bottom: 20px;
            overflow-y: auto;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .cart-popup .cp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }
        .cart-popup .cp-header h3 { font-size: 14px; color: #f97316; }
        .cart-popup .cp-header .cp-close {
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
        }
        .cart-popup .cp-item {
            display: flex;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #0f172a;
            font-size: 13px;
        }
        .cart-popup .cp-item .cp-name { flex: 1; color: #f1f5f9; font-weight: 500; }
        .cart-popup .cp-item .cp-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 8px;
        }
        .cart-popup .cp-item .cp-qty button {
            width: 26px; height: 26px;
            border: none;
            border-radius: 50%;
            background: #334155;
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-popup .cp-item .cp-qty button:active { background: #f97316; }
        .cart-popup .cp-item .cp-qty span { min-width: 20px; text-align: center; font-weight: 700; }
        .cart-popup .cp-item .cp-price { color: #f97316; font-weight: 700; min-width: 60px; text-align: right; }
        .cart-popup .cp-item .cp-del {
            width: 24px; height: 24px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #ef4444;
            font-size: 14px;
            cursor: pointer;
            margin-left: 4px;
        }
        .cart-popup .cp-item .cp-del:active { background: rgba(239,68,68,0.2); }
        .cart-popup .cp-empty {
            text-align: center;
            color: #475569;
            font-size: 13px;
            padding: 30px 10px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            pointer-events: none;
        }
        .toast {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            pointer-events: auto;
            animation: toastIn 0.2s ease;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #ef4444; }
        .toast.warning { background: #f59e0b; }
        .toast.info { background: #3b82f6; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 600px) {
            .menu-area { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 360px) {
            .menu-area { grid-template-columns: repeat(2, 1fr); }
            .m-item { min-height: 60px; padding: 10px 4px; }
            .m-item .name { font-size: 11px; }
            .m-item .price { font-size: 10px; }
            .cart-bar .pay-row .pay-btn { font-size: 12px; padding: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>☕ MILANO</h1>
            <div class="staff" id="staffName">👤 Đang tải...</div>
        </div>
        <div class="time" id="currentTime">--:--</div>
    </div>

    <!-- DANH MỤC NGANG -->
    <div class="cat-bar" id="catBar"></div>

    <!-- Ô TÌM KIẾM -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Tìm món..." oninput="onSearch()">
    </div>

    <!-- LƯỚI MENU -->
    <div class="menu-area" id="menuArea"></div>

    <!-- GIỎ HÀNG FIXED DƯỚI ĐÁY -->
    <div class="cart-bar" id="cartBar" onclick="toggleCartPopup()">
        <div class="cart-info">
            <span class="cart-count" id="cartCount">🛒 0 món</span>
            <span class="cart-total" id="cartTotal">0đ</span>
        </div>
        <div class="pay-row" onclick="event.stopPropagation()">
            <button class="pay-btn cash" id="payCash" onclick="pay('cash')">💰 Tiền mặt</button>
            <button class="pay-btn transfer" id="payTransfer" onclick="pay('transfer')">💳 Chuyển khoản</button>
            <button class="pay-btn grab" id="payGrab" onclick="pay('grab')">🛵 Grab</button>
        </div>
    </div>

    <!-- POPUP GIỎ HÀNG CHI TIẾT -->
    <div class="cart-overlay" id="cartOverlay" onclick="closeCartPopup(event)">
        <div class="cart-popup" id="cartPopup">
            <div class="cp-header">
                <h3>🛒 Giỏ hàng</h3>
                <span class="cp-close" onclick="closeCartPopup()">✕</span>
            </div>
            <div id="cartPopupItems"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="db.js?v=3"></script>
    <script src="auth.js"></script>
    <script src="ingredients.js"></script>
    <script src="notifications.js"></script>
    <script src="order.js"></script>
    <script src="print.js"></script>
    <script src="telegram.js"></script>
    <script src="esp32_audit.js"></script>
    <script src="takeaway.js"></script>
</body>
</html>
